name: Config Sync

on:
  schedule:
    # 每日固定时间运行：随机化 Daily Tasks 的 cron 与任务类型（UTC 16:00）
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: config-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh cron and task pool
        run: python sync_config.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily-tasks.yml config.json
          git diff --cached --quiet || git commit -m "chore: refresh schedule and task pool"
          git push